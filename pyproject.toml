[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "corgi-rl"
version = "0.1.0"
description = "Simulation-first, calibratable 12-DoF quadruped research"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mjlab==1.6.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.14.0",
  "rsl-rl-lib==5.4.2",
  "torch==2.9.1",
  "pydantic==2.12.3",
  "numpy==2.2.6",
  "onnxruntime==1.23.2",
  "imageio==2.37.2",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
corgi = "corgi_rl.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/corgi_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and the mjlab stack"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
